# Theme Knowledge Graph (Phase 1 seed).
# Each theme: children (sub-nodes), the human need it serves, the
# Trend -> Constraint -> Required solution chain, related ETFs, and company exposures.
# Exposure weight = share of the company's story tied to the theme (0..1);
# order = 1 first-order beneficiary, 2 second-order, 3 third-order.

themes:
  - id: ai-infrastructure
    name: AI Infrastructure
    description: Build-out of accelerated compute datacenters for training and inference.
    human_needs: [productivity, knowledge, time]
    horizon_years: "3-7"
    constraints:
      - trend: Model capability scales with compute
        constraint: GPU supply, power availability, cooling, network bandwidth
        solution: Accelerators, optical/electrical interconnect, HBM memory, liquid cooling, on-site power
    related_etfs: [SMH, GRID, XLU]
    children:
      - id: ai-gpus
        name: Accelerators
        exposures: {NVDA: [0.9, 1], AMD: [0.6, 1], AVGO: [0.6, 1], MRVL: [0.7, 1]}
      - id: ai-networking
        name: Networking & Interconnect
        exposures: {ANET: [0.8, 1], CRDO: [0.9, 1], ALAB: [0.9, 1], COHR: [0.6, 1], CIEN: [0.5, 1], AVGO: [0.2, 1]}
      - id: ai-memory
        name: Memory
        exposures: {MU: [0.7, 1]}
      - id: ai-cooling
        name: Thermal Management
        exposures: {VRT: [0.9, 1], MOD: [0.5, 1], NVT: [0.5, 1], FIX: [0.5, 2]}
      - id: ai-electrical
        name: Electrical Equipment
        exposures: {ETN: [0.4, 1], HUBB: [0.3, 2], PWR: [0.4, 2], GEV: [0.4, 1]}
      - id: ai-power-generation
        name: Power Generation
        exposures: {CEG: [0.5, 2], VST: [0.6, 2], NRG: [0.4, 2], GEV: [0.3, 2]}
      - id: ai-datacenter-real-estate
        name: Datacenter Real Estate
        exposures: {EQIX: [0.6, 2], DLR: [0.7, 2]}
      - id: ai-semicap
        name: Semiconductor Equipment
        exposures: {AMAT: [0.5, 2], LRCX: [0.5, 2], KLAC: [0.5, 2], TER: [0.4, 2]}
      - id: ai-hyperscalers
        name: Hyperscalers
        exposures: {MSFT: [0.4, 1], GOOGL: [0.3, 1], AMZN: [0.3, 1], ORCL: [0.5, 1], META: [0.3, 1]}

