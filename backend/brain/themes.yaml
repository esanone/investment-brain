        constraint: Power-efficient silicon, on-device memory
        solution: NPUs in phones/PCs/cars, low-power memory
    related_etfs: [SMH]
    exposures: {QCOM: [0.5, 1], AAPL: [0.3, 1], TXN: [0.2, 2], TSLA: [0.3, 2], AMD: [0.2, 1], MU: [0.2, 2]}

